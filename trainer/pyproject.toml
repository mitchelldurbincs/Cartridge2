[project]
name = "cartridge-trainer"
version = "0.1.0"
description = "AlphaZero-style trainer for Cartridge2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.15.0",
    "psycopg2-binary>=2.9.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.0",
    "bitbully>=0.0.79",
    "wandb>=0.16",
    # Orchestration core, extracted to a sibling repo. Imported at module
    # level by trainer.orchestrator.*, so `python -m trainer loop` cannot run
    # without it. Pinned to a commit for reproducibility; bump deliberately
    # and keep in sync with .github/workflows/ci.yml.
    # For local development against a sibling checkout, install it editable
    # first (`pip install -e ../../crucible`) — pip keeps the existing
    # installation and does not overwrite it with the pinned URL.
    "crucible @ git+https://github.com/mitchelldurbincs/crucible.git@d7eb32c2a2f1724d0a1206fd4137e3893e436e38",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]

[project.scripts]
trainer = "trainer.__main__:main"
trainer-loop = "trainer.orchestrator:main"
trainer-evaluate = "trainer.evaluator:main"
trainer-solver-eval = "trainer.solver_eval:main"
# Legacy alias
evaluator = "trainer.evaluator:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Generated by `make game-manifest` from the Rust engine. Without this entry
# setuptools ships no data files at all, and the wheel would import fine in
# development (tests put src/ on sys.path) while failing in any installed
# deployment.
[tool.setuptools.package-data]
trainer = ["game_metadata.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
