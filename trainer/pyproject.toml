[project]
name = "cartridge-trainer"
version = "0.1.0"
description = "Algorithm-cartridge trainer for Cartridge2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Torch 2.9's dynamo exporter is tested with ONNX 1.18/ONNX Script 0.4;
    # ONNX Runtime 1.18 is the first runtime in this stack with ONNX IR 10 support.
    "torch>=2.9.0",
    "numpy>=1.24.0",
    "onnx>=1.18.0",
    "onnxscript>=0.4.0",
    "onnxruntime>=1.18.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.35.69",
    "tomli>=2.0.0;python_version<'3.11'",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.0",
    "bitbully>=0.0.79",
    "wandb>=0.16",
    # Orchestration core, extracted to a sibling repo. Imported at module
    # level by trainer.orchestrator.*, so `python -m trainer loop` cannot run
    # without it. Pinned to a commit for reproducibility; bump deliberately
    # and keep in sync with .github/workflows/ci.yml.
    # For local development against a sibling checkout, install it editable
    # first (`pip install -e ../../crucible`) — pip keeps the existing
    # installation and does not overwrite it with the pinned URL.
    "crucible @ git+https://github.com/mitchelldurbincs/crucible.git@d7eb32c2a2f1724d0a1206fd4137e3893e436e38",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.16.1",
]

[project.scripts]
trainer = "trainer.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Generated by `make environment-manifest` from the Rust engine. Without this entry
# setuptools ships no data files at all, and the wheel would import fine in
# development (tests put src/ on sys.path) while failing in any installed
# deployment.
[tool.setuptools.package-data]
trainer = ["environment_manifest.json", "config.defaults.toml"]
"trainer.storage" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
