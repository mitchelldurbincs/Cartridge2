# Kustomize base configuration. Apply an overlay, not this credential-free base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartridge

# Common labels applied to resources and their selectors.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: cartridge2
    includeSelectors: true

resources:
  # Namespace and shared non-secret config
  - namespace.yaml
  - configmap.yaml
  - runtime-data-pvc.yaml

  # Infrastructure
  - postgres/init-configmap.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - minio/deployment.yaml
  - minio/service.yaml
  - minio/setup-job.yaml

  # Application components. The training Job owns its bounded collector
  # subprocesses; independent replay producers are intentionally unsupported.
  - trainer/job.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/ingress.yaml
