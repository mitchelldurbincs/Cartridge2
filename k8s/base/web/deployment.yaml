# Web Server Deployment - Backend API for playing against trained models
#
# Provides HTTP endpoints for:
# - Starting new games
# - Making moves (human vs bot)
# - Getting training stats
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cartridge
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cartridge2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cartridge2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        # Match the explicit image identity and preserve read access to files
        # projected by the trainer into the shared runtime-data claim.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          # Build with S3 support; see k8s/README.md.
          image: cartridge-web:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: cartridge-config
                  key: LOG_LEVEL
            - name: CARTRIDGE_WEB_HOST
              value: "0.0.0.0"
            - name: CARTRIDGE_WEB_PORT
              value: "8080"
            - name: CARTRIDGE_COMMON_DATA_DIR
              value: "/data"
            - name: CARTRIDGE_COMMON_ENV_ID
              valueFrom:
                configMapKeyRef:
                  name: cartridge-config
                  key: ENV_ID
            - name: CARTRIDGE_ALGORITHM_ID
              valueFrom:
                configMapKeyRef:
                  name: cartridge-config
                  key: ALGORITHM_ID
            - name: CARTRIDGE_STORAGE_MODEL_BACKEND
              value: "s3"
            - name: CARTRIDGE_STORAGE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: cartridge-config
                  key: S3_ENDPOINT
            - name: CARTRIDGE_STORAGE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cartridge-config
                  key: S3_BUCKET
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: cartridge-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: runtime-data
---
# Frontend Deployment - Nginx serving Svelte app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cartridge
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: cartridge2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: cartridge2
    spec:
      containers:
        - name: frontend
          # Build with: docker build -f web/frontend/Dockerfile -t cartridge-frontend web/frontend
          image: cartridge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
