# PostgreSQL Initialization Scripts
# Creates the schema on first startup
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: cartridge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cartridge2
data:
  01-schema.sql: |
    -- Cartridge2 replay schema v4.
    --
    -- Storage owns only the immutable replay envelope. The payload is opaque and
    -- is decoded by the algorithm cartridge named by algorithm_id and
    -- experience_schema. Every operation is fenced to one exact collection scope
    -- and source checkpoint. Changing an algorithm payload never changes this table.
    --
    -- collection_scopes makes each scope first-class: the first store to use a
    -- scope registers its profile and source checkpoint, later stores must agree
    -- exactly, and the foreign key rejects records written into an unregistered
    -- scope. The registry is also what the scope reaper uses to delete scopes no
    -- longer used by any live selection.
    --
    -- The replay_records autovacuum storage parameters and the foreign key are
    -- deliberately outside the validated runtime contract (validators check
    -- tables, columns, and primary keys); they exist so the reaper's bulk deletes
    -- are vacuumed promptly and unregistered writes fail closed.

    CREATE TABLE IF NOT EXISTS cartridge_schema_versions (
        component TEXT PRIMARY KEY,
        schema_version INTEGER NOT NULL CHECK (schema_version > 0)
    );

    INSERT INTO cartridge_schema_versions (component, schema_version)
    VALUES ('replay', 4)
    ON CONFLICT (component) DO NOTHING;

    CREATE TABLE IF NOT EXISTS collection_scopes (
        scope_id TEXT PRIMARY KEY
            CHECK (scope_id ~ '^[0-9a-f]{64}$'),
        env_id TEXT NOT NULL,
        env_contract_version BIGINT NOT NULL
            CHECK (env_contract_version BETWEEN 1 AND 4294967295),
        algorithm_id TEXT NOT NULL,
        experience_schema TEXT NOT NULL,
        source_checkpoint_id TEXT
            CHECK (
                source_checkpoint_id IS NULL
                OR source_checkpoint_id ~ '^[0-9a-f]{64}$'
            ),
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_collection_scopes_profile_created
        ON collection_scopes(
            env_id, env_contract_version, algorithm_id, experience_schema,
            created_at DESC
        );

    CREATE TABLE IF NOT EXISTS replay_records (
        id TEXT NOT NULL,
        env_id TEXT NOT NULL,
        env_contract_version BIGINT NOT NULL
            CHECK (env_contract_version BETWEEN 1 AND 4294967295),
        algorithm_id TEXT NOT NULL,
        experience_schema TEXT NOT NULL,
        collection_scope_id TEXT NOT NULL
            CHECK (collection_scope_id ~ '^[0-9a-f]{64}$')
            REFERENCES collection_scopes(scope_id),
        source_checkpoint_id TEXT
            CHECK (
                source_checkpoint_id IS NULL
                OR source_checkpoint_id ~ '^[0-9a-f]{64}$'
            ),
        episode_id TEXT NOT NULL,
        step_number BIGINT NOT NULL
            CHECK (step_number BETWEEN 0 AND 4294967295),
        payload BYTEA NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (
            env_id, env_contract_version, algorithm_id, experience_schema,
            collection_scope_id, id
        )
    ) WITH (autovacuum_vacuum_scale_factor = 0.05, autovacuum_vacuum_threshold = 1000);

    CREATE INDEX IF NOT EXISTS idx_replay_records_selection_created
        ON replay_records(
            env_id, env_contract_version, algorithm_id, experience_schema,
            collection_scope_id, source_checkpoint_id, created_at DESC
        );
