# Production overlay
# Production-sized synchronized-run resources
#
# Deploy with: kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartridge

resources:
  - ../../base
  - filestore-storageclass.yaml

# Production-specific patches
patches:
  # Production resource limits for the loop and its collector subprocesses.
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: trainer
      spec:
        template:
          spec:
            containers:
              - name: trainer
                resources:
                  requests:
                    memory: "2Gi"
                    cpu: "2000m"
                  limits:
                    memory: "8Gi"
                    cpu: "4000m"
    target:
      kind: Job
      name: trainer

  # Current GKE Basic HDD Filestore supports claims beginning at 100 GiB.
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: runtime-data
      spec:
        resources:
          requests:
            storage: 100Gi
    target:
      kind: PersistentVolumeClaim
      name: runtime-data

  # Production training settings
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cartridge-config
      data:
        EPISODES_PER_ITERATION: "1000"
        STEPS_PER_ITERATION: "800"
        NUM_ACTORS: "8"
        MCTS_MAX_SIMS: "800"
    target:
      kind: ConfigMap
      name: cartridge-config

  # GKE Autopilot enables the Filestore CSI driver. This overlay's custom class
  # targets the Terraform-managed production VPC rather than the default VPC.
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: runtime-data
      spec:
        storageClassName: cartridge-prod-filestore-rwx
    target:
      kind: PersistentVolumeClaim
      name: runtime-data

# Use registry images for production
images:
  - name: cartridge-alphazero
    newName: your-registry.example.com/cartridge/alphazero
    newTag: v1.0.0
  - name: cartridge-web
    newName: your-registry.example.com/cartridge/web
    newTag: v1.0.0
  - name: cartridge-frontend
    newName: your-registry.example.com/cartridge/frontend
    newTag: v1.0.0
