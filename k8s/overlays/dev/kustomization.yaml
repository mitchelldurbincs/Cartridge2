# GKE development overlay
# Minimal compute resources with multi-node shared storage.
#
# Deploy with: kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartridge

resources:
  - ../../base
  - ../../development-secrets
  - filestore-storageclass.yaml

patches:
  # Reduce synchronized-run resource requests.
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: trainer
      spec:
        template:
          spec:
            containers:
              - name: trainer
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "500m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
    target:
      kind: Job
      name: trainer

  # Current GKE Basic HDD Filestore supports claims beginning at 100 GiB.
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: runtime-data
      spec:
        storageClassName: cartridge-dev-filestore-rwx
        resources:
          requests:
            storage: 100Gi
    target:
      kind: PersistentVolumeClaim
      name: runtime-data

# Terraform's deployment instructions replace these image names immediately
# after applying the overlay.
images:
  - name: cartridge-alphazero
    newTag: latest
  - name: cartridge-web
    newTag: latest
  - name: cartridge-frontend
    newTag: latest
