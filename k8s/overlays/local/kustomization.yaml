# Local development overlay
# Minimal resources, single-node storage, and locally built images.
#
# Deploy with: kubectl apply -k k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartridge

resources:
  - ../../base
  - ../../development-secrets

patches:
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: trainer
      spec:
        template:
          spec:
            containers:
              - name: trainer
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "500m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
    target:
      kind: Job
      name: trainer

  # A single-node cluster can mount this RWO claim into trainer and web pods.
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: runtime-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    target:
      kind: PersistentVolumeClaim
      name: runtime-data

images:
  - name: cartridge-alphazero
    newTag: latest
  - name: cartridge-web
    newTag: latest
  - name: cartridge-frontend
    newTag: latest
