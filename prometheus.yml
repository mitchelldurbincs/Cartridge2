# Prometheus Configuration for Cartridge2
#
# Scrape targets:
#   - Synchronized loop: http://alphazero:9090/metrics
#   - Web:               http://web:8080/metrics
#
# Bounded collector subprocesses intentionally do not expose a stable service
# port. Their exact iteration evidence is aggregated by the parent loop.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Parent loop metrics (learning and committed-iteration progress)
  - job_name: 'alphazero-loop'
    static_configs:
      - targets: ['alphazero:9090']
    scrape_timeout: 10s

  # Web server metrics (game sessions, bot moves)
  - job_name: 'web'
    static_configs:
      - targets: ['web:8080']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9092']
