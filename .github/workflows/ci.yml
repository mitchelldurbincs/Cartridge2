name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Rust Jobs
  # ============================================
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            actor
            web
      - name: Check formatting (engine)
        run: cargo fmt --all --manifest-path engine/Cargo.toml -- --check
      - name: Check formatting (actor)
        run: cargo fmt --manifest-path actor/Cargo.toml -- --check
      - name: Check formatting (web)
        run: cargo fmt --manifest-path web/Cargo.toml -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            actor
            web
      # --locked: build the dependency graph recorded in the committed
      # Cargo.lock rather than re-resolving. Without it CI silently tests a
      # different graph than the one that was reviewed.
      - name: Clippy (engine)
        run: cargo clippy --locked --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: Clippy (model watcher, all features)
        run: cargo clippy --locked --manifest-path engine/Cargo.toml -p model-watcher --all-targets --all-features -- -D warnings
      - name: Clippy (actor, Linux features)
        run: cargo clippy --locked --manifest-path actor/Cargo.toml --all-targets --features s3 -- -D warnings
      - name: Clippy (web)
        run: cargo clippy --locked --manifest-path web/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Clippy (web without ONNX)
        run: cargo clippy --locked --manifest-path web/Cargo.toml --all-targets --no-default-features -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            actor
            web
      - name: Test engine
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Test model watcher (all features)
        run: cargo test --locked --manifest-path engine/Cargo.toml -p model-watcher --all-features
      - name: Test actor (filesystem and S3)
        # CoreML is an Apple-only execution provider. On Linux, `s3` is the
        # complete supported feature set and still covers both storage paths.
        run: cargo test --locked --manifest-path actor/Cargo.toml --features s3
      - name: Test web
        run: cargo test --locked --manifest-path web/Cargo.toml
      - name: Test web without ONNX
        run: cargo test --locked --manifest-path web/Cargo.toml --no-default-features

  rust-build:
    name: Rust Build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            actor
            web
      - name: Build engine
        run: cargo build --locked --release --manifest-path engine/Cargo.toml
      - name: Build actor
        run: cargo build --locked --release --manifest-path actor/Cargo.toml
      - name: Build web
        run: cargo build --locked --release --manifest-path web/Cargo.toml

  rust-security-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    # Gating, but with today's four known advisories listed explicitly so the
    # gate catches anything NEW while the existing backlog stays visible
    # instead of silently suppressed. Each needs a semver-major dependency
    # bump, so none is a one-line fix; they are tracked as follow-up work:
    #
    #   RUSTSEC-2024-0437  protobuf 2.28.0 <- prometheus 0.13.4 <- metrics-common.
    #                      Clearing it means prometheus 0.14+, which drops
    #                      protobuf but changes the API used by
    #                      engine/metrics-common and web/src/metrics.rs.
    #   RUSTSEC-2026-0098  rustls-webpki 0.101.7 <- rustls 0.21.12, reached only
    #   RUSTSEC-2026-0099  through feature-gated deps (not in the default build
    #   RUSTSEC-2026-0104  tree). Needs the rustls 0.23 chain.
    #
    # Delete an entry the moment its upgrade lands. Do not add one without a
    # justification here, and do not reach for continue-on-error again.
    env:
      AUDIT_IGNORES: >-
        --ignore RUSTSEC-2024-0437
        --ignore RUSTSEC-2026-0098
        --ignore RUSTSEC-2026-0099
        --ignore RUSTSEC-2026-0104
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            actor
            web
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # cargo-audit audits a *lockfile* and has no --manifest-path flag, so the
      # previous invocations exited with a CLI usage error -- which
      # continue-on-error then swallowed. The audit had never actually run.
      # Both halves are fixed here: the right flag, and no suppression.
      - name: Run cargo audit (engine)
        run: cargo audit --file engine/Cargo.lock $AUDIT_IGNORES
      - name: Run cargo audit (actor)
        run: cargo audit --file actor/Cargo.lock $AUDIT_IGNORES
      - name: Run cargo audit (web)
        run: cargo audit --file web/Cargo.lock $AUDIT_IGNORES

  # ============================================
  # Python Jobs (Trainer)
  # ============================================
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trainer/pyproject.toml
      - name: Install linters
        run: pip install ruff==0.16.1
      - name: Ruff check
        run: ruff check src/ tests/ smoke_test.py
      - name: Ruff format check
        run: ruff format --check src/ tests/ smoke_test.py

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trainer/pyproject.toml
      - name: Install package with dev dependencies
        # Pulls the pinned `crucible` orchestration core, which is declared in
        # trainer/pyproject.toml. Do not re-add an explicit crucible install
        # here: that pinned the SHA in two places, and the copies would drift.
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  python-security-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trainer/pyproject.toml
      - name: Install pip-audit
        run: pip install pip-audit
      # Advisory, deliberately: pip-audit resolves the environment rather than a
      # committed lockfile, so it reports transitive advisories the repo cannot
      # act on directly. cargo audit and gitleaks are the gating scanners.
      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

  # ============================================
  # Frontend Jobs (Svelte/TypeScript)
  # ============================================
  frontend:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Advisory, deliberately: most findings here are dev-only transitive deps
      # of the build toolchain, which do not ship in the built frontend.
      - name: Run npm audit
        run: npm audit
        continue-on-error: true
      - name: Svelte check (TypeScript)
        run: npm run check
      - name: Frontend unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  # ============================================
  # Docker Build Validation
  # ============================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build AlphaZero image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.alphazero
          push: false
          tags: cartridge-alphazero:test
          build-args: CARGO_FEATURES=s3
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          tags: cartridge-web:test
          build-args: CARGO_FEATURES=s3
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web/frontend
          file: ./web/frontend/Dockerfile
          push: false
          tags: cartridge-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Secrets Scanning
  # ============================================
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gating: a secrets scanner that cannot fail the build is decorative.
      # NOTE for the first run: gitleaks-action v2 is free for personal repos
      # and public repos, but requires GITLEAKS_LICENSE for organisation-owned
      # ones. If this job starts failing on licensing rather than on findings,
      # add the secret -- do not re-add continue-on-error.
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
