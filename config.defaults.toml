# Cartridge2 Default Configuration Values
#
# This file is the SINGLE SOURCE OF TRUTH for all default configuration values.
# Rust embeds it; the Python wheel ships a byte-identical package-resource copy.
#
# DO NOT edit default values in code - edit them here instead.
#
# For user configuration, copy values to config.toml and modify there.

[common]
# Base runtime root. All files are isolated under
# profiles/{algorithm_id}/{env_id}/v{env_contract_version}.
data_dir = "./data"
env_id = "tictactoe"
log_level = "info"

[algorithm]
# Canonical cartridge ID. Startup rejects unknown IDs and incompatible environments.
id = "alphazero_board_v1"

[training]
iterations = 100
episodes_per_iteration = 500
steps_per_iteration = 1000
batch_size = 64
learning_rate = 0.001
weight_decay = 0.0001
grad_clip_norm = 1.0
device = "cpu"
checkpoint_interval = 100
num_actors = 1  # Number of parallel actor processes for self-play

[evaluation]
interval = 1
games = 50
win_threshold = 0.55      # Win rate needed to become champion
eval_vs_random = true     # Also evaluate against random baseline
simulations = 0           # MCTS sims per move in eval (0 = policy head only, no search)
temperature = 0.2         # Action-selection temperature for evaluation games
solver_games = 0          # Perfect-solver eval games per evaluation; connect4 must opt in
evaluation_seed = 42      # Fixed seed for head-to-head, random, and solver games
promotion_metric = "win_rate"   # "win_rate" or "solver_optimal"
promotion_margin = 0.0    # Inactive under win_rate; set explicitly with solver_optimal

[actor]
actor_id = "actor-1"
episode_timeout_secs = 30
log_interval = 50

[web]
host = "0.0.0.0"
port = 8080
# CORS allowed origins (empty = localhost-only development allowlist)
# Production: set to ["https://your-domain.com"]
allowed_origins = []

[mcts]
c_puct = 1.4
temperature = 1.0
late_temperature = 1.0      # Must equal temperature while temp_threshold is disabled
temp_threshold = 0        # Switch move; 0 disables, otherwise must be below max_horizon
dirichlet_alpha = 0.3      # Set alpha and weight to 0 together to disable noise
dirichlet_weight = 0.25
eval_batch_size = 32
onnx_intra_threads = 1
# Simulation ramping: start_sims + (iteration-1) * sim_ramp_rate, capped at max_sims
start_sims = 50           # Simulations for first iteration
max_sims = 400            # Maximum simulations
sim_ramp_rate = 20        # Simulations to add per iteration

[logging]
format = "text"           # "text" or "json" - use "json" for cloud deployments
include_timestamps = true # Include timestamps in logs (false if cloud adds them)
include_target = true     # Include module target in logs

[storage]
model_backend = "filesystem"
postgres_url = "postgresql://cartridge:cartridge@localhost:5432/cartridge"
pool_max_size = 16
pool_connect_timeout = 30
pool_idle_timeout = 300
replay_retained_scopes = 2  # Newest collection scopes kept per profile; older scopes are reaped after each commit

[wandb]
enabled = false           # Log cartridge loop runs to Weights & Biases
required = false          # true: fail loudly instead of falling back to no-op logging
project = "cartridge2"
entity = ""               # Empty = logged-in default entity
group = ""                # Groups related runs in the W&B UI
tags = []
init_timeout_seconds = 30.0
